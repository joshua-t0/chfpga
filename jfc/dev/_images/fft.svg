<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   width="400"
   height="200"
   viewBox="0 0 400 200"
   xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker
       id="arrowhead"
       markerWidth="10"
       markerHeight="10"
       refX="9"
       refY="3"
       orient="auto">
      <polygon
         points="0 0, 10 3, 0 6"
         fill="black" />
    </marker>
  </defs>
  
  <!-- Input bus (thick line on left) -->
  <line
     x1="20"
     y1="100"
     x2="80"
     y2="100"
     stroke="black"
     stroke-width="4"
     marker-end="url(#arrowhead)" />
  <text
     x="50"
     y="90"
     font-family="Arial"
     font-size="12"
     text-anchor="middle">Input</text>
  
  <!-- Rotate Module box -->
  <rect
     x="100"
     y="70"
     width="80"
     height="60"
     fill="white"
     stroke="black"
     stroke-width="2" />
  <text
     x="140"
     y="105"
     font-family="Arial"
     font-size="12"
     text-anchor="middle">Rotate</text>
  <text
     x="140"
     y="120"
     font-family="Arial"
     font-size="12"
     text-anchor="middle">Module</text>
  
  <!-- FFT box -->
  <rect
     x="200"
     y="70"
     width="80"
     height="60"
     fill="white"
     stroke="black"
     stroke-width="2" />
  <text
     x="240"
     y="105"
     font-family="Arial"
     font-size="14"
     font-weight="bold"
     text-anchor="middle">FFT</text>
  
  <!-- Output bus (thick line on right) -->
  <line
     x1="300"
     y1="100"
     x2="360"
     y2="100"
     stroke="black"
     stroke-width="4"
     marker-end="url(#arrowhead)" />
  <text
     x="340"
     y="90"
     font-family="Arial"
     font-size="12"
     text-anchor="middle">Output</text>
  
  <!-- Data flow arrows -->
  <line
     x1="180"
     y1="100"
     x2="200"
     y2="100"
     stroke="black"
     stroke-width="2"
     marker-end="url(#arrowhead)" />
  <line
     x1="280"
     y1="100"
     x2="300"
     y2="100"
     stroke="black"
     stroke-width="2"
     marker-end="url(#arrowhead)" />
  
  <!-- FFT delay box -->
  <rect
     x="210"
     y="150"
     width="60"
     height="40"
     fill="white"
     stroke="black"
     stroke-width="2" />
  <text
     x="240"
     y="170"
     font-family="Arial"
     font-size="11"
     text-anchor="middle">FFT</text>
  <text
     x="240"
     y="185"
     font-family="Arial"
     font-size="11"
     text-anchor="middle">delay</text>
  
  <!-- Connection from FFT delay to FFT input -->
  <line
     x1="230"
     y1="150"
     x2="230"
     y2="130"
     stroke="black"
     stroke-width="1"
     stroke-dasharray="3,3" />
  <line
     x1="230"
     y1="130"
     x2="200"
     y2="130"
     stroke="black"
     stroke-width="1"
     stroke-dasharray="3,3" />
  <line
     x1="200"
     y1="130"
     x2="200"
     y2="100"
     stroke="black"
     stroke-width="1"
     stroke-dasharray="3,3" />
  
  <!-- Connection from FFT output to FFT delay -->
  <line
     x1="280"
     y1="100"
     x2="280"
     y2="120"
     stroke="black"
     stroke-width="1"
     stroke-dasharray="3,3" />
  <line
     x1="280"
     y1="120"
     x2="250"
     y2="120"
     stroke="black"
     stroke-width="1"
     stroke-dasharray="3,3" />
  <line
     x1="250"
     y1="120"
     x2="250"
     y2="150"
     stroke="black"
     stroke-width="1"
     stroke-dasharray="3,3" />
</svg>


