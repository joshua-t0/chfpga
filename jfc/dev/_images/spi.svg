<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   width="500"
   height="450"
   viewBox="0 0 500 450"
   version="1.1"
   id="svg1"
   sodipodi:docname="spi.svg"
   inkscape:version="1.4.2 (1:1.4.2+202505120738+ebf0e940d0)"
   xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
   xmlns:sodipodi="http://sodipodi.sourceforge.net/DTD/sodipodi-0.dtd"
   xmlns="http://www.w3.org/2000/svg"
   xmlns:svg="http://www.w3.org/2000/svg">
  <defs id="defs1" />
  <sodipodi:namedview
     id="namedview1"
     pagecolor="#ffffff"
     bordercolor="#000000"
     borderopacity="0.25"
     inkscape:showpageshadow="2"
     inkscape:pageopacity="0.0"
     inkscape:pagecheckerboard="0"
     inkscape:deskcolor="#d1d1d1"
     showgrid="false" />
  <title id="title1">SPI Block Diagram</title>
  
  <!-- Main SPI container -->
  <rect
     x="10"
     y="10"
     width="480"
     height="430"
     fill="none"
     stroke="#000000"
     stroke-width="2"
     stroke-dasharray="4, 2"
     id="rect_main" />
  <text
     x="20"
     y="30"
     font-family="sans-serif"
     font-size="14px"
     font-weight="bold"
     fill="#000000"
     id="text_title">SPI</text>

  <!-- BSB Control Interface -->
  <rect x="30" y="50" width="150" height="80" fill="#e8f4f8" stroke="#000000" stroke-width="1.5" id="rect_bsb" />
  <text x="40" y="70" font-family="sans-serif" font-size="11px" font-weight="bold" fill="#000000">BSB Control</text>
  <text x="40" y="85" font-family="sans-serif" font-size="9px" fill="#000000">ctrl_cmd_in</text>
  <text x="40" y="100" font-family="sans-serif" font-size="9px" fill="#000000">ctrl_rply_out</text>
  <text x="40" y="115" font-family="sans-serif" font-size="8px" fill="#666666">Memory-mapped</text>
  
  <!-- Input arrow for BSB -->
  <line x1="0" y1="95" x2="30" y2="95" stroke="#000000" stroke-width="1.5" id="line_bsb_in" />
  <polygon points="38,100 30,104 30,96" fill="#000000" id="poly_bsb_in" transform="translate(0,-5)" />

  <!-- SPI Controller Core -->
  <rect x="220" y="50" width="200" height="200" fill="#fff4e8" stroke="#000000" stroke-width="1.5" id="rect_spi_core" />
  <text x="230" y="70" font-family="sans-serif" font-size="12px" font-weight="bold" fill="#000000">SPI Controller</text>
  <text x="230" y="85" font-family="sans-serif" font-size="9px" fill="#666666">Configurable speed</text>
  
  <!-- Control Registers -->
  <rect x="240" y="100" width="80" height="60" fill="#f0f0f0" stroke="#000000" stroke-width="1" id="rect_ctrl" />
  <text x="250" y="115" font-family="sans-serif" font-size="9px" font-weight="bold" fill="#000000">Control</text>
  <text x="250" y="130" font-family="sans-serif" font-size="8px" fill="#666666">Registers</text>
  <text x="250" y="145" font-family="sans-serif" font-size="8px" fill="#666666">TX_DATA</text>
  <text x="250" y="155" font-family="sans-serif" font-size="8px" fill="#666666">RX_DATA</text>
  
  <!-- State Machine -->
  <rect x="340" y="100" width="70" height="60" fill="#e8f8e8" stroke="#000000" stroke-width="1" id="rect_fsm" />
  <text x="350" y="115" font-family="sans-serif" font-size="9px" font-weight="bold" fill="#000000">State</text>
  <text x="350" y="130" font-family="sans-serif" font-size="9px" font-weight="bold" fill="#000000">Machine</text>
  <text x="350" y="145" font-family="sans-serif" font-size="8px" fill="#666666">4-phase</text>
  <text x="350" y="155" font-family="sans-serif" font-size="8px" fill="#666666">operation</text>
  
  <!-- Clock Divider -->
  <rect x="240" y="180" width="170" height="40" fill="#f8e8e8" stroke="#000000" stroke-width="1" id="rect_clkdiv" />
  <text x="250" y="195" font-family="sans-serif" font-size="9px" font-weight="bold" fill="#000000">Clock Divider</text>
  <text x="250" y="210" font-family="sans-serif" font-size="8px" fill="#666666">CLK_DIVIDE_FACTOR</text>
  
  <!-- Shift Registers -->
  <rect x="240" y="230" width="170" height="10" fill="#e8e8f8" stroke="#000000" stroke-width="1" id="rect_shift" />
  <text x="250" y="238" font-family="sans-serif" font-size="8px" fill="#666666">TX/RX Shift Registers (32-bit)</text>
  
  <!-- Connection from BSB to SPI Core -->
  <line x1="180" y1="95" x2="220" y2="95" stroke="#000000" stroke-width="1.5" id="line_bsb_to_core" />

  <!-- SPI Bus Interface -->
  <rect x="30" y="280" width="390" height="120" fill="#e8e8f8" stroke="#000000" stroke-width="1.5" id="rect_spi_bus" />
  <text x="40" y="300" font-family="sans-serif" font-size="11px" font-weight="bold" fill="#000000">SPI Bus Interface</text>
  <text x="40" y="315" font-family="sans-serif" font-size="9px" fill="#000000">Multiple Ports (NUMBER_OF_PORTS)</text>
  
  <!-- Common SPI Signals -->
  <rect x="50" y="330" width="100" height="50" fill="#ffffff" stroke="#000000" stroke-width="1" id="rect_common" />
  <text x="60" y="345" font-family="sans-serif" font-size="9px" font-weight="bold" fill="#000000">Common</text>
  <text x="60" y="360" font-family="sans-serif" font-size="8px" fill="#000000">spi_sck</text>
  <text x="60" y="370" font-family="sans-serif" font-size="8px" fill="#000000">spi_mosi</text>
  
  <!-- SPI Port 0 -->
  <rect x="170" y="330" width="80" height="50" fill="#ffffff" stroke="#000000" stroke-width="1" id="rect_port0" />
  <text x="180" y="345" font-family="sans-serif" font-size="9px" font-weight="bold" fill="#000000">Port 0</text>
  <text x="180" y="360" font-family="sans-serif" font-size="8px" fill="#000000">spi_miso[0]</text>
  <text x="180" y="370" font-family="sans-serif" font-size="8px" fill="#000000">spi_cs_n[0]</text>
  
  <!-- SPI Port 1 -->
  <rect x="270" y="330" width="80" height="50" fill="#ffffff" stroke="#000000" stroke-width="1" id="rect_port1" />
  <text x="280" y="345" font-family="sans-serif" font-size="9px" font-weight="bold" fill="#000000">Port 1</text>
  <text x="280" y="360" font-family="sans-serif" font-size="8px" fill="#000000">spi_miso[1]</text>
  <text x="280" y="370" font-family="sans-serif" font-size="8px" fill="#000000">spi_cs_n[1]</text>
  
  <!-- SPI Port N -->
  <rect x="370" y="330" width="40" height="50" fill="#ffffff" stroke="#000000" stroke-width="1" id="rect_portN" />
  <text x="375" y="345" font-family="sans-serif" font-size="9px" font-weight="bold" fill="#000000">...</text>
  <text x="375" y="360" font-family="sans-serif" font-size="8px" fill="#000000">Port</text>
  <text x="375" y="370" font-family="sans-serif" font-size="8px" fill="#000000">N-1</text>
  
  <!-- Connection from SPI Core to Bus -->
  <line x1="320" y1="250" x2="320" y2="280" stroke="#000000" stroke-width="1.5" id="line_core_to_bus" />
  
  <!-- SPI Bus Signals -->
  <line x1="150" y1="350" x2="170" y2="350" stroke="#000000" stroke-width="1" id="line_spi_sck" />
  <line x1="150" y1="360" x2="170" y2="360" stroke="#000000" stroke-width="1" id="line_spi_mosi" />
  <line x1="250" y1="360" x2="270" y2="360" stroke="#000000" stroke-width="1" id="line_spi_miso0" />
  <line x1="250" y1="370" x2="270" y2="370" stroke="#000000" stroke-width="1" id="line_spi_cs0" />
  <line x1="350" y1="360" x2="370" y2="360" stroke="#000000" stroke-width="1" id="line_spi_miso1" />
  <line x1="350" y1="370" x2="370" y2="370" stroke="#000000" stroke-width="1" id="line_spi_cs1" />
  
  <!-- Additional SPI signals -->
  <rect x="50" y="390" width="150" height="30" fill="#f0f0f0" stroke="#000000" stroke-width="1" id="rect_addl" />
  <text x="60" y="405" font-family="sans-serif" font-size="8px" fill="#000000">spi_addr[2:0]</text>
  <text x="60" y="415" font-family="sans-serif" font-size="8px" fill="#000000">spi_rst_n</text>
  
  <!-- External SPI devices -->
  <text x="220" y="355" font-family="sans-serif" font-size="9px" fill="#666666">→ External</text>
  <text x="220" y="370" font-family="sans-serif" font-size="9px" fill="#666666">SPI Devices</text>
  
  <!-- Clock and Reset -->
  <rect x="30" y="50" width="150" height="30" fill="#f0f0f0" stroke="#000000" stroke-width="1" id="rect_clk" />
  <text x="40" y="65" font-family="sans-serif" font-size="9px" fill="#000000">clk200, rst</text>
  <text x="40" y="75" font-family="sans-serif" font-size="8px" fill="#666666">ctrl_clk, ctrl_rst</text>
  
  <!-- Clock inputs -->
  <line x1="0" y1="65" x2="30" y2="65" stroke="#000000" stroke-width="1" id="line_clk_in" />
  <polygon points="38,70 30,74 30,66" fill="#000000" id="poly_clk_in" transform="translate(0,-5)" />

  <!-- Notes -->
  <text x="30" y="440" font-family="sans-serif" font-size="10px" font-weight="bold" fill="#000000">Notes:</text>
  <text x="30" y="455" font-family="sans-serif" font-size="8px" fill="#666666">• SPI supports 1-4 byte transactions (configurable)</text>
  <text x="30" y="470" font-family="sans-serif" font-size="8px" fill="#666666">• Clock speed: 200 MHz / CLK_DIVIDE_FACTOR / 4</text>
  <text x="30" y="485" font-family="sans-serif" font-size="8px" fill="#666666">• Only one port active at a time (selected by CS)</text>

</svg>

