<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   width="500"
   height="400"
   viewBox="0 0 500 400"
   version="1.1"
   id="svg1"
   sodipodi:docname="i2c.svg"
   inkscape:version="1.4.2 (1:1.4.2+202505120738+ebf0e940d0)"
   xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
   xmlns:sodipodi="http://sodipodi.sourceforge.net/DTD/sodipodi-0.dtd"
   xmlns="http://www.w3.org/2000/svg"
   xmlns:svg="http://www.w3.org/2000/svg">
  <defs id="defs1" />
  <sodipodi:namedview
     id="namedview1"
     pagecolor="#ffffff"
     bordercolor="#000000"
     borderopacity="0.25"
     inkscape:showpageshadow="2"
     inkscape:pageopacity="0.0"
     inkscape:pagecheckerboard="0"
     inkscape:deskcolor="#d1d1d1"
     showgrid="false" />
  <title id="title1">I2C Block Diagram</title>
  
  <!-- Main I2C container -->
  <rect
     x="10"
     y="10"
     width="480"
     height="380"
     fill="none"
     stroke="#000000"
     stroke-width="2"
     stroke-dasharray="4, 2"
     id="rect_main" />
  <text
     x="20"
     y="30"
     font-family="sans-serif"
     font-size="14px"
     font-weight="bold"
     fill="#000000"
     id="text_title">I2C</text>

  <!-- BSB Control Interface -->
  <rect x="30" y="50" width="150" height="80" fill="#e8f4f8" stroke="#000000" stroke-width="1.5" id="rect_bsb" />
  <text x="40" y="70" font-family="sans-serif" font-size="11px" font-weight="bold" fill="#000000">BSB Control</text>
  <text x="40" y="85" font-family="sans-serif" font-size="9px" fill="#000000">ctrl_cmd_in</text>
  <text x="40" y="100" font-family="sans-serif" font-size="9px" fill="#000000">ctrl_rply_out</text>
  <text x="40" y="115" font-family="sans-serif" font-size="8px" fill="#666666">Memory-mapped</text>
  
  <!-- Input arrow for BSB -->
  <line x1="0" y1="95" x2="30" y2="95" stroke="#000000" stroke-width="1.5" id="line_bsb_in" />
  <polygon points="38,100 30,104 30,96" fill="#000000" id="poly_bsb_in" transform="translate(0,-5)" />

  <!-- I2C Controller Core -->
  <rect x="220" y="50" width="200" height="180" fill="#fff4e8" stroke="#000000" stroke-width="1.5" id="rect_i2c_core" />
  <text x="230" y="70" font-family="sans-serif" font-size="12px" font-weight="bold" fill="#000000">I2C Controller</text>
  <text x="230" y="90" font-family="sans-serif" font-size="9px" fill="#666666">100 KHz operation</text>
  
  <!-- Control Registers -->
  <rect x="240" y="110" width="80" height="50" fill="#f0f0f0" stroke="#000000" stroke-width="1" id="rect_ctrl" />
  <text x="250" y="125" font-family="sans-serif" font-size="9px" font-weight="bold" fill="#000000">Control</text>
  <text x="250" y="140" font-family="sans-serif" font-size="8px" fill="#666666">Registers</text>
  <text x="250" y="155" font-family="sans-serif" font-size="8px" fill="#666666">Address, Data</text>
  
  <!-- State Machine -->
  <rect x="340" y="110" width="70" height="50" fill="#e8f8e8" stroke="#000000" stroke-width="1" id="rect_fsm" />
  <text x="350" y="125" font-family="sans-serif" font-size="9px" font-weight="bold" fill="#000000">State</text>
  <text x="350" y="140" font-family="sans-serif" font-size="9px" font-weight="bold" fill="#000000">Machine</text>
  <text x="350" y="155" font-family="sans-serif" font-size="8px" fill="#666666">Timing</text>
  
  <!-- Timing Generator -->
  <rect x="240" y="180" width="170" height="40" fill="#f8e8e8" stroke="#000000" stroke-width="1" id="rect_timing" />
  <text x="250" y="195" font-family="sans-serif" font-size="9px" font-weight="bold" fill="#000000">Timing Generator</text>
  <text x="250" y="210" font-family="sans-serif" font-size="8px" fill="#666666">tHIGH, tLOW, tBUF</text>
  
  <!-- Connection from BSB to I2C Core -->
  <line x1="180" y1="95" x2="220" y2="95" stroke="#000000" stroke-width="1.5" id="line_bsb_to_core" />

  <!-- I2C Bus Interface -->
  <rect x="30" y="260" width="390" height="100" fill="#e8e8f8" stroke="#000000" stroke-width="1.5" id="rect_i2c_bus" />
  <text x="40" y="280" font-family="sans-serif" font-size="11px" font-weight="bold" fill="#000000">I2C Bus Interface</text>
  <text x="40" y="295" font-family="sans-serif" font-size="9px" fill="#000000">Multiple Ports (NUMBER_OF_PORTS)</text>
  
  <!-- I2C Port 0 -->
  <rect x="50" y="310" width="80" height="40" fill="#ffffff" stroke="#000000" stroke-width="1" id="rect_port0" />
  <text x="60" y="325" font-family="sans-serif" font-size="9px" font-weight="bold" fill="#000000">Port 0</text>
  <text x="60" y="340" font-family="sans-serif" font-size="8px" fill="#000000">SCL, SDA</text>
  
  <!-- I2C Port 1 -->
  <rect x="150" y="310" width="80" height="40" fill="#ffffff" stroke="#000000" stroke-width="1" id="rect_port1" />
  <text x="160" y="325" font-family="sans-serif" font-size="9px" font-weight="bold" fill="#000000">Port 1</text>
  <text x="160" y="340" font-family="sans-serif" font-size="8px" fill="#000000">SCL, SDA</text>
  
  <!-- I2C Port N -->
  <rect x="250" y="310" width="80" height="40" fill="#ffffff" stroke="#000000" stroke-width="1" id="rect_portN" />
  <text x="260" y="325" font-family="sans-serif" font-size="9px" font-weight="bold" fill="#000000">Port N-1</text>
  <text x="260" y="340" font-family="sans-serif" font-size="8px" fill="#000000">SCL, SDA</text>
  
  <!-- Connection from I2C Core to Bus -->
  <line x1="320" y1="230" x2="320" y2="260" stroke="#000000" stroke-width="1.5" id="line_core_to_bus" />
  
  <!-- I2C Bus Signals -->
  <line x1="130" y1="330" x2="160" y2="330" stroke="#000000" stroke-width="1" id="line_i2c_scl0" />
  <line x1="130" y1="340" x2="160" y2="340" stroke="#000000" stroke-width="1" id="line_i2c_sda0" />
  <line x1="230" y1="330" x2="260" y2="330" stroke="#000000" stroke-width="1" id="line_i2c_scl1" />
  <line x1="230" y1="340" x2="260" y2="340" stroke="#000000" stroke-width="1" id="line_i2c_sda1" />
  
  <!-- External I2C devices -->
  <text x="350" y="325" font-family="sans-serif" font-size="9px" fill="#666666">→ External</text>
  <text x="350" y="340" font-family="sans-serif" font-size="9px" fill="#666666">I2C Devices</text>
  
  <!-- Clock and Reset -->
  <rect x="30" y="50" width="150" height="30" fill="#f0f0f0" stroke="#000000" stroke-width="1" id="rect_clk" />
  <text x="40" y="65" font-family="sans-serif" font-size="9px" fill="#000000">clk200, rst</text>
  <text x="40" y="75" font-family="sans-serif" font-size="8px" fill="#666666">ctrl_clk, ctrl_rst</text>
  
  <!-- Clock inputs -->
  <line x1="0" y1="65" x2="30" y2="65" stroke="#000000" stroke-width="1" id="line_clk_in" />
  <polygon points="38,70 30,74 30,66" fill="#000000" id="poly_clk_in" transform="translate(0,-5)" />

  <!-- Notes -->
  <text x="30" y="380" font-family="sans-serif" font-size="10px" font-weight="bold" fill="#000000">Notes:</text>
  <text x="30" y="395" font-family="sans-serif" font-size="8px" fill="#666666">• I2C operates at ~100 KHz, compliant with I2C and PMBus standards</text>
  <text x="30" y="410" font-family="sans-serif" font-size="8px" fill="#666666">• Supports 1 or 2-phase transactions (address + data)</text>
  <text x="30" y="425" font-family="sans-serif" font-size="8px" fill="#666666">• Multiple ports allow connection to different I2C buses</text>

</svg>

