<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   width="500"
   height="400"
   viewBox="0 0 500 400"
   version="1.1"
   id="svg1"
   sodipodi:docname="irigb_decoder.svg"
   inkscape:version="1.4.2 (1:1.4.2+202505120738+ebf0e940d0)"
   xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
   xmlns:sodipodi="http://sodipodi.sourceforge.net/DTD/sodipodi-0.dtd"
   xmlns="http://www.w3.org/2000/svg"
   xmlns:svg="http://www.w3.org/2000/svg">
  <defs id="defs1" />
  <sodipodi:namedview
     id="namedview1"
     pagecolor="#ffffff"
     bordercolor="#000000"
     borderopacity="0.25"
     inkscape:showpageshadow="2"
     inkscape:pageopacity="0.0"
     inkscape:pagecheckerboard="0"
     inkscape:deskcolor="#d1d1d1"
     showgrid="false" />
  <title id="title1">IRIG-B Decoder Block Diagram</title>
  
  <!-- Main IRIG-B Decoder container -->
  <rect
     x="10"
     y="10"
     width="480"
     height="380"
     fill="none"
     stroke="#000000"
     stroke-width="2"
     stroke-dasharray="4, 2"
     id="rect_main" />
  <text
     x="20"
     y="30"
     font-family="sans-serif"
     font-size="14px"
     font-weight="bold"
     fill="#000000"
     id="text_title">IRIG-B Decoder</text>

  <!-- Input Selection -->
  <rect x="30" y="50" width="150" height="80" fill="#e8f4f8" stroke="#000000" stroke-width="1.5" id="rect_input" />
  <text x="40" y="70" font-family="sans-serif" font-size="11px" font-weight="bold" fill="#000000">Input Selection</text>
  <text x="40" y="85" font-family="sans-serif" font-size="9px" fill="#000000">irig[0:7]</text>
  <text x="40" y="100" font-family="sans-serif" font-size="9px" fill="#000000">source[2:0]</text>
  <text x="40" y="115" font-family="sans-serif" font-size="9px" fill="#000000">pol</text>
  
  <!-- IRIG-B input signals -->
  <line x1="0" y1="85" x2="30" y2="85" stroke="#000000" stroke-width="1.5" id="line_irig_in" />
  <polygon points="38,90 30,94 30,86" fill="#000000" id="poly_irig_in" transform="translate(0,-5)" />
  <text x="5" y="80" font-family="sans-serif" font-size="8px" fill="#000000">irig[0:7]</text>
  
  <line x1="0" y1="100" x2="30" y2="100" stroke="#000000" stroke-width="1" id="line_source" />
  <polygon points="38,105 30,109 30,101" fill="#000000" id="poly_source" transform="translate(0,-5)" />
  <text x="5" y="95" font-family="sans-serif" font-size="8px" fill="#000000">source</text>
  
  <line x1="0" y1="115" x2="30" y2="115" stroke="#000000" stroke-width="1" id="line_pol" />
  <polygon points="38,120 30,124 30,116" fill="#000000" id="poly_pol" transform="translate(0,-5)" />
  <text x="5" y="110" font-family="sans-serif" font-size="8px" fill="#000000">pol</text>

  <!-- Symbol Detector -->
  <rect x="220" y="50" width="150" height="100" fill="#fff4e8" stroke="#000000" stroke-width="1.5" id="rect_symbol" />
  <text x="230" y="70" font-family="sans-serif" font-size="11px" font-weight="bold" fill="#000000">Symbol Detector</text>
  <text x="230" y="85" font-family="sans-serif" font-size="9px" fill="#000000">Bit Timing</text>
  <text x="230" y="100" font-family="sans-serif" font-size="8px" fill="#666666">• 0: low &lt; 8 ms</text>
  <text x="230" y="115" font-family="sans-serif" font-size="8px" fill="#666666">• 1: low &lt; 5 ms</text>
  <text x="230" y="130" font-family="sans-serif" font-size="8px" fill="#666666">• Marker: low &lt; 2 ms</text>
  <text x="230" y="145" font-family="sans-serif" font-size="8px" fill="#666666">10 ms per bit</text>
  
  <!-- Connection from input to symbol detector -->
  <line x1="180" y1="95" x2="220" y2="95" stroke="#000000" stroke-width="1.5" id="line_to_symbol" />

  <!-- Decoder State Machine -->
  <rect x="400" y="50" width="70" height="100" fill="#e8f8e8" stroke="#000000" stroke-width="1.5" id="rect_fsm" />
  <text x="410" y="70" font-family="sans-serif" font-size="10px" font-weight="bold" fill="#000000">Decoder</text>
  <text x="410" y="85" font-family="sans-serif" font-size="10px" font-weight="bold" fill="#000000">State</text>
  <text x="410" y="100" font-family="sans-serif" font-size="10px" font-weight="bold" fill="#000000">Machine</text>
  <text x="410" y="115" font-family="sans-serif" font-size="8px" fill="#666666">100 states</text>
  <text x="410" y="130" font-family="sans-serif" font-size="8px" fill="#666666">(1 per bit)</text>
  
  <!-- Connection from symbol detector to FSM -->
  <line x1="370" y1="100" x2="400" y2="100" stroke="#000000" stroke-width="1.5" id="line_to_fsm" />

  <!-- Time Field Capture -->
  <rect x="220" y="180" width="250" height="120" fill="#f0f0f0" stroke="#000000" stroke-width="1.5" id="rect_capture" />
  <text x="230" y="200" font-family="sans-serif" font-size="11px" font-weight="bold" fill="#000000">Time Field Capture</text>
  
  <!-- Time fields -->
  <rect x="240" y="210" width="100" height="80" fill="#ffffff" stroke="#000000" stroke-width="1" id="rect_fields" />
  <text x="250" y="225" font-family="sans-serif" font-size="9px" font-weight="bold" fill="#000000">Fields:</text>
  <text x="250" y="240" font-family="sans-serif" font-size="8px" fill="#000000">• Seconds (s)</text>
  <text x="250" y="255" font-family="sans-serif" font-size="8px" fill="#000000">• Minutes (m)</text>
  <text x="250" y="270" font-family="sans-serif" font-size="8px" fill="#000000">• Hours (h)</text>
  <text x="250" y="285" font-family="sans-serif" font-size="8px" fill="#000000">• Day of Year (d)</text>
  
  <!-- Additional fields -->
  <rect x="360" y="210" width="100" height="80" fill="#ffffff" stroke="#000000" stroke-width="1" id="rect_fields2" />
  <text x="370" y="225" font-family="sans-serif" font-size="8px" fill="#000000">• Year (y)</text>
  <text x="370" y="240" font-family="sans-serif" font-size="8px" fill="#000000">• Control (c)</text>
  <text x="370" y="255" font-family="sans-serif" font-size="8px" fill="#000000">• SBS (sbs)</text>
  <text x="370" y="270" font-family="sans-serif" font-size="8px" fill="#666666">Sub-second</text>
  <text x="370" y="285" font-family="sans-serif" font-size="8px" fill="#666666">counter</text>
  
  <!-- Connection from FSM to capture -->
  <line x1="435" y1="150" x2="435" y2="180" stroke="#000000" stroke-width="1.5" id="line_fsm_to_capture" />

  <!-- Sub-second Counter -->
  <rect x="30" y="180" width="150" height="60" fill="#f8e8e8" stroke="#000000" stroke-width="1.5" id="rect_ss" />
  <text x="40" y="200" font-family="sans-serif" font-size="11px" font-weight="bold" fill="#000000">Sub-second</text>
  <text x="40" y="215" font-family="sans-serif" font-size="11px" font-weight="bold" fill="#000000">Counter</text>
  <text x="40" y="230" font-family="sans-serif" font-size="8px" fill="#666666">200 MHz clock</text>
  <text x="40" y="240" font-family="sans-serif" font-size="8px" fill="#666666">10 ns resolution</text>
  
  <!-- Connection from input to sub-second counter -->
  <line x1="180" y1="210" x2="220" y2="210" stroke="#000000" stroke-width="1" id="line_to_ss" />

  <!-- Output Register -->
  <rect x="30" y="260" width="440" height="80" fill="#e8e8f8" stroke="#000000" stroke-width="1.5" id="rect_output" />
  <text x="40" y="280" font-family="sans-serif" font-size="11px" font-weight="bold" fill="#000000">Output Timestamp (irigb structure)</text>
  
  <!-- Timestamp fields -->
  <text x="50" y="300" font-family="sans-serif" font-size="9px" fill="#000000">ts.year, ts.day, ts.hour, ts.min, ts.sec, ts.ss</text>
  <text x="50" y="315" font-family="sans-serif" font-size="8px" fill="#666666">Registered at start of next frame</text>
  <text x="50" y="330" font-family="sans-serif" font-size="8px" fill="#666666">Latency: ~1.010 seconds</text>
  
  <!-- PPS Output -->
  <rect x="400" y="260" width="60" height="40" fill="#f0f0f0" stroke="#000000" stroke-width="1" id="rect_pps" />
  <text x="410" y="275" font-family="sans-serif" font-size="9px" font-weight="bold" fill="#000000">PPS</text>
  <text x="410" y="290" font-family="sans-serif" font-size="8px" fill="#000000">0.5s pulse</text>
  
  <!-- Output signals -->
  <line x1="480" y1="300" x2="510" y2="300" stroke="#000000" stroke-width="1.5" id="line_ts_out" />
  <polygon points="518,305 510,309 510,301" fill="#000000" id="poly_ts_out" transform="translate(0,-5)" />
  <text x="515" y="295" font-family="sans-serif" font-size="8px" fill="#000000">ts</text>
  
  <line x1="460" y1="280" x2="490" y2="280" stroke="#000000" stroke-width="1.5" id="line_pps_out" />
  <polygon points="498,285 490,289 490,281" fill="#000000" id="poly_pps_out" transform="translate(0,-5)" />
  <text x="495" y="275" font-family="sans-serif" font-size="8px" fill="#000000">pps</text>
  
  <!-- Connection from capture to output -->
  <line x1="345" y1="300" x2="400" y2="300" stroke="#000000" stroke-width="1.5" id="line_capture_to_output" />
  <line x1="345" y1="280" x2="400" y2="280" stroke="#000000" stroke-width="1.5" id="line_pps_connection" />

  <!-- Clock Input -->
  <rect x="30" y="50" width="150" height="30" fill="#f0f0f0" stroke="#000000" stroke-width="1" id="rect_clk" />
  <text x="40" y="65" font-family="sans-serif" font-size="9px" fill="#000000">clk_200mhz</text>
  <text x="40" y="75" font-family="sans-serif" font-size="8px" fill="#666666">200 MHz</text>
  
  <!-- Clock input -->
  <line x1="0" y1="65" x2="30" y2="65" stroke="#000000" stroke-width="1" id="line_clk_in" />
  <polygon points="38,70 30,74 30,66" fill="#000000" id="poly_clk_in" transform="translate(0,-5)" />

  <!-- Notes -->
  <text x="30" y="360" font-family="sans-serif" font-size="10px" font-weight="bold" fill="#000000">Notes:</text>
  <text x="30" y="375" font-family="sans-serif" font-size="8px" fill="#666666">• IRIG-B frame: 100 bits, 1 second duration (10 ms per bit)</text>
  <text x="30" y="390" font-family="sans-serif" font-size="8px" fill="#666666">• Symbol detection based on low period duration</text>
  <text x="30" y="405" font-family="sans-serif" font-size="8px" fill="#666666">• Sub-second counter provides 10 ns interpolation within each second</text>
  <text x="30" y="420" font-family="sans-serif" font-size="8px" fill="#666666">• Timestamp registered at start of next frame (latency ~1.010 s)</text>

</svg>

