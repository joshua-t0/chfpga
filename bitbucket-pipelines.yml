# This is a sample build configuration for Python.
# Check our guides at https://confluence.atlassian.com/x/x4UWN for more examples.
# Only use spaces to indent your .yml configuration.
# -----
# You can specify a custom docker image from Docker Hub as your build environment.
image: python:2.7
clone:
  lfs: true
pipelines:
  default:
    - step:
        caches:
          - pip
        script: # Modify the commands below to build your repository.
          - cd _doc
          - pip install -r requirements.txt
          - make html
          - git lfs clone git@bitbucket.org:winterlandcosmology/winterlandcosmology.bitbucket.io.git www
          - mkdir -p www/chfpga/jfc_dev/
          - rm -rf www/chfpga/jfc_dev/*
          - ls -al
          - ls -al build
          - cp -r build/html/* www/chfpga/jfc_dev/
          - cd www
          - git config --global user.email "bb-pipelines@jfciche.com"
          - git config --global user.name "BitBucket Pipelines (chfpga/jfc_dev)"
          - git add -A chfpga/jfc_dev
          - git lfs ls-files
          - git commit -m "bitbucket-pipelines updated chfpga/jfc_dev sphinx-generated documentation"
          - git push

