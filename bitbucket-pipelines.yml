# This is a sample build configuration for Python.
# Check our guides at https://confluence.atlassian.com/x/x4UWN for more examples.
# Only use spaces to indent your .yml configuration.
# -----
# You can specify a custom docker image from Docker Hub as your build environment.
image: python:3.8
clone:
  lfs: true
definitions:
  caches:
    - pip: ~/.cache/pip
    - venv: .venv
pipelines:
  default:
    - step:
        caches:
          - pip
          - venv
        script: # Modify the commands below to build your repository.
          - python -m venv .venv
          - source .venv/bin/activate
          - DOC_PUBLISH_FOLDER='chfpga/'$BITBUCKET_BRANCH
          - cd docs
          - pip install -e .
          - make html
          - git clone git@bitbucket.org:winterlandcosmology/winterlandcosmology.bitbucket.io.git www
          - mkdir -p www/$DOC_PUBLISH_FOLDER/
          - rm -rf www/$DOC_PUBLISH_FOLDER/*
          - ls -al
          - ls -al build
          - cp -r build/html/* www/$DOC_PUBLISH_FOLDER/
          - cd www/chfpga
          - rm -f latest
          - mkdir -p latest
          - |
            cat > latest/index.html <<REDIRECT_EOF
            <!DOCTYPE html>
            <html> <head>
              <meta http-equiv="refresh" content="0; url=../$BITBUCKET_BRANCH/">
              <link rel="canonical" href="../$BITBUCKET_BRANCH/">
            </head> <body>
              <p>Redirecting to <a href="../$BITBUCKET_BRANCH/">latest documentation</a>...</p>
            </body> </html>
            REDIRECT_EOF
          - cd ../..
          - cd www
          - git config --global user.email "bb-pipelines@jfcliche.com"
          - git config --global user.name "BitBucket Pipelines"
          - git add $DOC_PUBLISH_FOLDER chfpga/latest/
          - git diff-index --quiet HEAD -- || git commit -m "Auto update of $DOC_PUBLISH_FOLDER documentation"
          - |
            for i in 1 2 3 4 5; do
              git pull --rebase origin master && git push && break
              echo "Push failed, retrying in ${i}0 seconds..."
              sleep ${i}0
            done

        concurrency: # Make sure multiple pipelines are not run at the same time (repo lock collision)
          group: docs-deploy
          cancel_in_progress: false