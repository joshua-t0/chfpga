file_list:
    - "*.vhd"
    - "*UDP_MAC/*.vhd"
    - CHAN/*.vhd
    - CMD/*.vhd
    - CORR/*.vhd
    - CROSSBAR/*.vhd
    - SIM/*.vhd
    - SYSTEM/*.vhd
    - testbenches/*.vhd


rule:
    # global:
    #     severity: Warning
    record_type_definition_001:
        disable: true
    function_019:  # Move parenthesis to next line.
        disable: true  # We want Single line functions to be more compact
    whitespace_002:
        severity: Warning
    variable_assignment_001: # Move parenthesis after assignment to the next line.
        disable: true # keep short aggregates on one line
    port_012: # default value son port
        disable: true # We use that. ok with Vivado tools.
    port_map_010: # No comments on port map - hard to maintain
        disable: true # We think it still improves redabillity.